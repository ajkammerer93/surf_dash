name: Daily social post

# Posts the day's regional surf card to Instagram.
#
# Requires two repository secrets (Settings -> Secrets and variables -> Actions),
# both produced by scripts/instagram_auth.py:
#   IG_USER_ID       Instagram user id
#   IG_ACCESS_TOKEN  long-lived token with instagram_business_content_publish
#
# Posts daily on two schedules -- one per coast, so each region lands near its
# own local dawn. Each run publishes a feed card and a matching Story.
# Can also be run manually from the Actions tab (use dry_run to print the card
# without posting).
#
# Tokens expire after 60 days; instagram-token-refresh.yml rotates them.

on:
  workflow_dispatch:
    inputs:
      region:
        description: 'Region slug (blank = weekday rotation)'
        required: false
        default: ''
      dry_run:
        description: 'Print the card without posting'
        type: boolean
        default: false
      story_only:
        description: 'Post only the story (no feed card)'
        type: boolean
        default: false
  schedule:
    # Two schedules so each coast gets a dawn-ish post rather than one time
    # that suits the East Coast and catches the Pacific asleep. Minute 7
    # rather than 0: top-of-hour is when Actions queues are most congested.
    - cron: '7 11 * * *'   # 07:00 ET  -- east group
    - cron: '7 16 * * *'   # 09:00 PT / 06:00 HT -- west group

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Post card
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          INPUT_REGION: ${{ inputs.region }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_STORY_ONLY: ${{ inputs.story_only }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          ARGS=""
          if [ -n "$INPUT_REGION" ]; then ARGS="$ARGS --region $INPUT_REGION"; fi
          if [ "$INPUT_DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "$INPUT_STORY_ONLY" = "true" ]; then ARGS="$ARGS --story-only"; fi
          # Which cron fired decides which coast posts. A manual run sends no
          # group, so it posts whatever region the rotation names today.
          case "$SCHEDULE" in
            "7 11 * * *") ARGS="$ARGS --group east" ;;
            "7 16 * * *") ARGS="$ARGS --group west" ;;
          esac
          python scripts/instagram_publish.py $ARGS
