name: SEO audit

# Collects CI health, site health, Search Console and Cloudflare metrics into a
# snapshot, and publishes it to the unprotected seo-data branch -- the same
# arrangement forecast-verification.yml uses, because master is protected and
# the credentials have to live in Actions rather than with whoever reads the
# data later.
#
# Secrets (all optional; each collector degrades on its own and records why):
#   GSC_SA_JSON    Google service-account key for an account added to the
#                  Search Console property with FULL permission -- Restricted
#                  cannot call the URL Inspection API, which is the part that
#                  tells us how much of the site Google has actually indexed.
#   GSC_PROPERTY   sc-domain:freesurfforecast.com, or the URL-prefix form
#   CF_API_TOKEN   Cloudflare token with Account Analytics: Read
#   CF_ACCOUNT_ID  Cloudflare account id
#   CF_SITE_TAG    Web Analytics site tag -- NOT the beacon token in the page
#                  snippet. They differ, and the beacon token returns a valid
#                  account with zero events, which looks like a dead site.
#
# Runs after the day's forecast-verification cycle so the freshness check sees
# a settled pipeline rather than one mid-run.
#
# Authorship policy, binding on anything that writes this snapshot up.
# Every artifact that lands on GitHub -- commit messages, issue bodies, pull
# request titles and descriptions, review and issue comments -- is written in
# the first person as the repository owner, with no tooling attribution of any
# kind. No co-author trailers, no generated-by footers, no note of what
# produced the text, no emoji. The audience is future maintainers, and the
# provenance of the prose is not useful to them.
#
# The job below emits no prose of its own; it only publishes a JSON snapshot
# to a data branch. The rule therefore constrains whatever reads that
# snapshot afterwards and files the findings.

on:
  workflow_dispatch:
  schedule:
    - cron: '25 3 * * *'  # 03:25 UTC daily

permissions:
  contents: write

concurrency:
  group: seo-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: seo-data
          path: seodata
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests google-auth google-api-python-client

      - name: Collect audit snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GSC_SA_JSON: ${{ secrets.GSC_SA_JSON }}
          GSC_PROPERTY: ${{ secrets.GSC_PROPERTY }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_SITE_TAG: ${{ secrets.CF_SITE_TAG }}
        run: python scripts/seo_audit.py --data-dir seodata

      - name: Report collector reachability
        run: |
          python - <<'PY'
          import json
          a = json.load(open('seodata/audit-latest.json'))
          sc, cf = a.get('search_console', {}), a.get('cloudflare', {})
          def line(name, section, ok_key):
              if section.get('unavailable'):
                  print(f"::warning::{name} unavailable: {section['unavailable']}")
              elif section.get('error') or section.get(f'{ok_key}_error'):
                  print(f"::warning::{name} errored: "
                        f"{section.get('error') or section.get(f'{ok_key}_error')}")
              else:
                  print(f"{name}: OK")
          line('Search Console', sc, 'search_analytics')
          line('Cloudflare', cf, 'cloudflare')

          # Web Vitals is a Beta dataset, so a renamed field is a live
          # possibility rather than a hypothetical. The collector records the
          # real schema when its query fails; print that here, because the
          # failure mode to avoid is a missing section that reads as a clean
          # run. The p75 pair is printed with its sample count attached: at
          # this site's traffic a 7-day p75 can rest on very few pageloads,
          # and a number without its n invites acting on one visitor's phone.
          wv = a.get('web_vitals', {})
          if wv.get('unavailable'):
              print(f"::warning::Web Vitals unavailable: {wv['unavailable']}")
          elif wv.get('error'):
              print(f"::warning::Web Vitals errored: {wv['error']}")
              hint = wv.get('schema_hint') or {}
              for k, v in hint.items():
                  print(f"::warning::  schema {k}: {v}")
          else:
              # Until the CLS field's meaning is settled, print the whole
              # distribution. A score varies smoothly; a per-event rating
              # interpolated between ranks clusters on -1/0/1. The first run
              # returned p75=1 for four elements and -1 for others, and a CLS
              # score cannot be negative, so one percentile cannot decide it.
              spread = wv.get('cls_spread_7d') or {}
              if spread:
                  vals = ' '.join(
                      f"{k.replace('cumulativeLayoutShift','')}={v}"
                      for k, v in sorted(spread.items()) if k != 'samples')
                  print(f"CLS spread 7d (n={spread.get('samples')}): {vals}")
              # Print the whole CLS distribution until the field's meaning
              # is settled. A score varies smoothly across percentiles; a
              # per-event rating pins to -1/0/1 with interpolated fractions
              # between. The first real run gave p75 = 1 for four elements and
              # -1 for others, and a CLS score cannot be negative.
              spread = wv.get('cls_spread_7d') or {}
              if spread:
                  vals = ' '.join(
                      f"{k.replace('cumulativeLayoutShift', '')}={v}"
                      for k, v in sorted(spread.items()) if k != 'samples')
                  print(f"CLS spread 7d (n={spread.get('samples')}): {vals}")
              for window in ('sitewide_1d', 'sitewide_7d'):
                  m = wv.get(window) or {}
                  if not m:
                      continue
                  vals = ' '.join(f"{k}={v}" for k, v in sorted(m.items())
                                  if k != 'samples')
                  print(f"Web Vitals p75 {window}: n={m.get('samples')} {vals}")
              if wv.get('low_sample_warning'):
                  print(f"::warning::Web Vitals: {wv['low_sample_warning']}")
              for row in (wv.get('by_path_7d') or [])[:8]:
                  cls = row.get('cumulativeLayoutShiftP75')
                  if cls is not None and cls > 0.1:
                      print(f"::warning::CLS p75 over budget on "
                            f"{row.get('requestPath')}: {cls} "
                            f"(n={row.get('samples')})")
              # The elements real visitors saw move, worst first. This is the
              # line that turns "CLS is bad" into a file and a selector, so it
              # prints whether or not anything is over budget.
              worst = sorted(
                  (r for r in (wv.get('cls_elements_7d') or [])
                   if r.get('cumulativeLayoutShiftP75')),
                  key=lambda r: -r['cumulativeLayoutShiftP75'])[:5]
              for r in worst:
                  print(f"CLS p75 {r['cumulativeLayoutShiftP75']:.4f} "
                        f"n={r.get('samples')} "
                        f"{r.get('cumulativeLayoutShiftElement') or '(unattributed)'} "
                        f"on {r.get('cumulativeLayoutShiftPath') or '(any path)'}")
          for w in a['ci'].get('failing', []):
              print(f"::warning::workflow failing: {w}")
          for p in a['site'].get('problems', []):
              print(f"::warning::site problem: {p}")
          PY

      - name: Commit snapshot
        if: always()
        run: |
          cd seodata
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "SEO audit $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
