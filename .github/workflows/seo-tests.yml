name: SEO Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Weekly on Monday at 9am UTC
    - cron: '0 9 * * 1'

jobs:
  seo-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        # requirements-dev.txt, not a bare `pip install pytest`: a test-only
        # import that exists in a local venv and not here fails COLLECTION, so
        # the whole suite is skipped rather than one test failing. That put
        # master red for three commits.
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        # tests/, not tests/test_seo.py: the accuracy-card and UX-collector
        # suites were invisible to CI while this named one file, so a
        # regression in either would have reached master green. Nothing here
        # needs playwright -- the collector imports it lazily, inside the
        # function that launches a browser.
        run: pytest tests/ -v

      - name: Generate SEO report
        if: always()
        run: python scripts/seo_report.py --no-history -o reports/seo-report.md

      - name: Upload SEO report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-report
          path: reports/seo-report.md
          retention-days: 90
